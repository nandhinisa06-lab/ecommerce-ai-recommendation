<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSmart AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🛍️ ShopSmart AI</h1>
        <p>AI-Powered Product Recommendations</p>
    </header>

    <main>

        <h2>Welcome to ShopSmart AI</h2>

        {% if session.get("username") %}

        <p>
            👋 Welcome, <strong>{{ session["username"] }}</strong>!
        </p>

        {% else %}

        <p>
            Discover products specially recommended for you.
        </p>

        {% endif %}

        <br>


        <!-- Product Search -->

        <input
            type="text"
            id="homeSearchInput"
            placeholder="🔍 Search for a product..."
        >

        <button id="homeSearchButton">
            Search 🔍
        </button>

        <br><br>


        <!-- Login / Signup / Logout -->

        {% if session.get("username") %}

        <a href="/logout">
            <button>🚪 Logout</button>
        </a>

        {% else %}

        <a href="/login">
            <button>🔐 Login</button>
        </a>

        <a href="/signup">
            <button>📝 Sign Up</button>
        </a>

        {% endif %}

        <br><br>


        <!-- My Profile -->

        <a href="/profile">
            <button>👤 My Profile</button>
        </a>

        <br><br>


        <!-- Explore Products -->

        <a href="/products">
            <button>Explore Products 🛍️</button>
        </a>

        <br><br>


        <!-- View Cart -->

        <a href="/cart">
            <button>View Cart 🛒</button>
        </a>

        <br><br>


        <!-- My Orders -->

        <a href="/orders">
            <button>📦 My Orders</button>
        </a>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
