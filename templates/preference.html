<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Preference - ShopEasy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛒 ShopEasy
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/recommendations">Recommendations</a>
        </div>

    </nav>


    <section class="recommendations">

        <h2>🤖 Choose Your Interest</h2>

        <p>Select a category to get personalized suggestions.</p>

        <form action="/set-preference" method="POST">

            <p>
                <select name="category" required>

                    <option value="">
                        -- Select Category --
                    </option>

                    <option value="Mobile">
                        📱 Mobile
                    </option>

                    <option value="Laptop">
                        💻 Laptop
                    </option>

                    <option value="Audio">
                        🎧 Audio
                    </option>

                    <option value="Smart Watch">
                        ⌚ Smart Watch
                    </option>

                </select>
            </p>

            <p>
                <button type="submit" class="btn">
                    Get My Suggestions 🤖
                </button>
            </p>

        </form>

    </section>

</body>

</html>
