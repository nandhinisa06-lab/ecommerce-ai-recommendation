<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success - ShopSmart AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🛍️ ShopSmart AI</h1>
        <p>Order Confirmation</p>
    </header>

    <main>

        <div class="product-details">

            <h2>🎉 Order Placed Successfully!</h2>

            <p style="font-size: 18px; margin-top: 15px;">
                Thank you for shopping with ShopSmart AI.
            </p>

            <p>
                Your order has been successfully placed.
            </p>

            <br>

            <div style="
                background: #f0fdf4;
                padding: 20px;
                border-radius: 12px;
                border: 1px solid #bbf7d0;
            ">

                <p style="color: #166534;">
                    ✅ Order Confirmed
                </p>

                <h3 style="
                    font-size: 24px;
                    color: #2563eb;
                    margin-top: 10px;
                ">
                    Total Amount: ₹{{ total }}
                </h3>

            </div>

            <br><br>

            <a href="/orders">
                <button>
                    📦 View My Orders
                </button>
            </a>

            <a href="/products">
                <button>
                    🛍️ Continue Shopping
                </button>
            </a>

            <br>

            <a href="/">
                <button>
                    🏠 Back to Home
                </button>
            </a>

        </div>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
